name: Release Agent Binaries

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            suffix: linux-amd64
          - goarch: arm64
            suffix: linux-arm64
          - goarch: arm
            goarm: "7"
            suffix: linux-armv7

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build agent binary
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X main.Version=${{ github.ref_name }} \
              -X main.Repo=${{ github.repository }}" \
            -o agent \
            .

      # Archive name must match what updater.go constructs:
      #   agent-{tag}-{suffix}.tar.gz
      - name: Create archive
        run: |
          ARCHIVE="agent-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz"
          tar -czf "$ARCHIVE" -C agent agent
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Verify archive files
        run: |
          ls -lh agent-* || echo "❌ No archive files found"
          echo "ARCHIVE env var: ${{ env.ARCHIVE }}"
          
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "${{ env.ARCHIVE }}" \
            "${{ env.ARCHIVE }}.sha256"
