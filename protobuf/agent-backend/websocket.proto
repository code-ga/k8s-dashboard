syntax = "proto3";
package api;

option go_package = "./pb";

// Wrapper for all messages sent from Agent to Server
message AgentPayload {
  oneof payload {
    Heartbeat heartbeat = 1;
    CommandResponse command_response = 2;
    StreamData stream_data = 3;
    AGENT_AUTHORIZE_USER authorize_user = 4;
  }
}

message StreamData {
  string stream_id = 1;
  bytes data = 2; // Data chunk
  bool is_error = 3; // True for stderr
  bool closed = 4; // Stream closed
  
  enum StreamDataType {
    DATA = 0;
    RESIZE = 1;
  }
  StreamDataType type = 5;
  int32 rows = 6;
  int32 cols = 7;
}

message CommandResponse {
  string id = 1;
  bool success = 2;
  string error = 3;
  string data = 4;
}

// Wrapper for messages sent from Server to Agent
message ServerPayload {
  oneof payload {
    Command command = 1;
    StreamData stream_data = 2;
  }
}

message Heartbeat {
  // Information about the cluster itself
  ClusterResource cluster_resource = 1;
  
  // List of nodes in the cluster
  repeated Node nodes = 2;
  
  // List of pods (can be extensive)
  repeated Pod pods = 3;
  

  // List of services
  repeated Service services = 4;
  
  // List of deployments
  repeated Deployment deployments = 6;

  // List of config maps
  repeated ConfigMap config_maps = 7;

  // List of secrets
  repeated Secret secrets = 8;

  // List of ingresses (IngressRoute / IngressRouteTCP / IngressRouteUDP)
  repeated Ingress ingresses = 9;

  // List of Persistent Volume Claims
  repeated PVC pvcs = 10;

  // List of StorageClasses
  repeated StorageClass storage_classes = 11;

  // List of PersistentVolumes
  repeated PV pvs = 12;

  // Timestamp of the heartbeat
  int64 timestamp = 5;
}

message AGENT_AUTHORIZE_USER {
  string token = 1;
}

message ClusterResource {
  // Total CPU capacity (millicores)
  int64 cpu_capacity = 1;
  // Total Memory capacity (MiB)
  int64 ram_capacity = 2;
  // Current CPU usage (millicores)
  int64 cpu_usage = 3;
  // Current Memory usage (MiB)
  int64 ram_usage = 4;
  // Cluster domain
  string cluster_domain = 5;
}

message ContainerPort {
  int32 container_port = 1;
  string name = 2;
  string protocol = 3; // TCP, UDP
}

message Node {
  string name = 1;
  int64 cpu_usage = 2;
  int64 ram_usage = 3;
  int64 cpu_capacity = 4;
  int64 ram_capacity = 5;
  // JSON string or key=value pairs for labels
  map<string, string> labels = 6;
  string uid = 7;
  string status = 8;
  repeated string roles = 9;
  map<string, string> annotations = 10;

  string resource_config = 11;
}

message Deployment {
  string name = 1;
  string namespace = 2;
  int32 replicas = 3;
  int32 available_replicas = 4;
  int32 unavailable_replicas = 5;
  // JSON string or key=value pairs for labels
  map<string, string> labels = 6;
  // JSON string or key=value pairs for selector
  map<string, string> selector = 7;
  // Image used in the first container of the template (simplified)
  string docker_image = 8;
  string uid = 9;

  // New fields for full parity
  string command = 10;
  string args = 11;
  string env_variables = 12;
  int64 cpu_request = 13;
  int64 cpu_limit = 14;
  int64 memory_request = 15;
  int64 memory_limit = 16;
  repeated ContainerPort ports = 17;
  map<string, string> annotations = 18;
  map<string, string> template_annotations = 19;

  string resource_config = 20;
}

message Pod {
  string name = 1;
  string namespace = 2;
  string node_name = 3;
  // Main image (or list if multiple containers)
  string docker_image = 4;
  int32 replicas = 5;
  // Status (Running, Pending, etc.)
  string status = 6;
  
  // Resource requirements
  int64 cpu_request = 7;
  int64 cpu_limit = 8;
  int64 memory_request = 9;
  int64 memory_limit = 10;
  
  string command = 11;
  // JSON string or sensitive data masked
  string env_variables = 12;
  
  // Changed to support multiple ports
  repeated ContainerPort ports = 13;
  string uid = 14;
  int64 cpu_usage = 15;
  int64 ram_usage = 16;
  
  // New field for parity
  map<string, string> labels = 17;
  string args = 18;
  map<string, string> annotations = 19;

  string resource_config = 20;
}

message ServicePort {
  string name = 1;
  string protocol = 2; // TCP, UDP
  int32 port = 3;
  int32 target_port = 4;
  int32 node_port = 5;
}

message Service {
  string name = 1;
  string namespace = 2;
  string type = 3; // ClusterIP, NodePort, LoadBalancer
  string cluster_ip = 4;
  // Selector labels
  map<string, string> selector = 5;
  string domain = 6;
  string uid = 7;
  map<string, string> labels = 8;
  repeated ServicePort ports = 9;
  map<string, string> annotations = 10;

  string resource_config = 11;
}

message ConfigMap {
  string name = 1;
  string namespace = 2;
  map<string, string> data = 3;
  map<string, bytes> binary_data = 4;
  string uid = 5;
  map<string, string> labels = 6;
  bool immutable = 7;
  map<string, string> annotations = 8;

  string resource_config = 9;
}

message Secret {
  string name = 1;
  string namespace = 2;
  map<string, bytes> data = 3;
  string type = 4;
  string uid = 5;
  map<string, string> labels = 6;
  bool immutable = 7;
  map<string, string> annotations = 8;

  string resource_config = 9;
}

message Ingress {
  string name = 1;
  string namespace = 2;
  // Protocol: http, tcp, or udp (inferred from Traefik resource kind)
  string protocol = 3;
  // External gateway port (0 for http which uses the default entrypoint)
  int32 port = 4;
  // Internal service port
  int32 internal_port = 5;
  // Service name this ingress routes to
  string service_name = 6;
  // Hostname/domain rule for HTTP routes
  string domain = 7;
  // Path prefix (HTTP only)
  string path = 8;
  // Kubernetes UID of the IngressRoute resource
  string uid = 9;
  map<string, string> labels = 10;
  map<string, string> annotations = 11;

  string resource_config = 12;
}

message PVC {
  string name = 1;
  string namespace = 2;
  int64 capacity = 3; // in MiB
  string phase = 4;
  string storage_class = 5;
  string volume_name = 6;
  string uid = 7;
  map<string, string> labels = 8;
  map<string, string> annotations = 9;

  string resource_config = 10;
}

message StorageClass {
  string name = 1;
  string provisioner = 2;
  string reclaim_policy = 3;
  string volume_binding_mode = 4;
  bool allow_volume_expansion = 5;
  map<string, string> annotations = 6;
  map<string, string> labels = 7;

  string resource_config = 8;
}

message PV {
  string name = 1;
  int64 capacity = 2; // in MiB
  string phase = 3; // Available, Bound, Released, Failed
  string reclaim_policy = 4;
  string storage_class = 5;
  string bound_pvc = 6; // namespace/name of bound PVC
  repeated string access_modes = 7;
  map<string, string> annotations = 8;
  map<string, string> labels = 9;

  string resource_config = 10;
}

message Command {
  string id = 1;
  enum CommandType {
    UNKNOWN = 0;
    EDIT_RESOURCE = 1;
    CREATE_DEPLOYMENT = 2;
    SCALE_DEPLOYMENT = 3;
    DELETE_DEPLOYMENT = 4;
    CREATE_POD = 5;
    DELETE_POD = 6;
    DELETE_NODE = 7;
    GET_JOIN_TOKEN = 8;
    STREAM_LOGS = 9;
    EXEC = 10;
    CREATE_SERVICE = 11;
    DELETE_SERVICE = 12;
    DELETE_RESOURCE = 13;
    CREATE_RESOURCE = 14;
    CREATE_INGRESS = 15;
    DELETE_INGRESS = 16;
    CREATE_CONFIGMAP = 17;
    DELETE_CONFIGMAP = 18;
    CREATE_SECRET = 19;
    DELETE_SECRET = 20;
    DESCRIBE_RESOURCE = 21;
    GET_ALL_EVENTS = 22;
    REDEPLOY_DEPLOYMENT = 23;
    CREATE_PVC = 24;
    DELETE_PVC = 25;
    EDIT_PVC = 26;
    RESIZE_PVC = 27;
    CREATE_STORAGE_CLASS = 28;
    DELETE_STORAGE_CLASS = 29;
    SET_DEFAULT_STORAGE_CLASS = 30;
    CREATE_PV = 31;
    DELETE_PV = 32;
    CREATE_EPHEMERAL_CONTAINER = 33;
  }
  CommandType type = 2;
  
  // Payload depends on the command type (e.g., serialized JSON or YAML)
  string payload = 3;
  
  // Target resource details if applicable
  string target_namespace = 4;
  string target_name = 5;
}
message JoinTokenData {
  string command = 1;
  string token = 2;
  string discovery_token_ca_cert_hash = 3;
  string api_server_endpoint = 4;
  string expiration = 5;
}

